version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: antigaspi-postgres
    environment:
      POSTGRES_DB: antigaspi
      POSTGRES_USER: antigaspi
      POSTGRES_PASSWORD: antigaspi_dev_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U antigaspi']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: antigaspi-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
