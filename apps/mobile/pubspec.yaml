name: anti_gaspi_dz
description: "Plateforme anti-gaspillage alimentaire pour l'Algérie"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: 0.20.2  # Pinned to match flutter_localizations SDK requirement
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  google_maps_flutter: ^2.17.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.4.1
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Closes A1-08: .env removed from assets. Use --dart-define=API_URL=... at build time.
    - assets/
    - assets/images/

dependency_overrides:
  objective_c: 9.1.0
